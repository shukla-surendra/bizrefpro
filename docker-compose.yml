version: '3.5'
networks:
  seenet:
services:
  nginx:
    image: nginx:latest
    container_name: dev_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_dev:/etc/nginx/conf.d
      - .:/usr/src/app
      - ./devlogdna:/var/log/nginx/
    depends_on:
      - web
    networks:
    - seenet
  web:
    build: .
    container_name: dev_django
    command: bash deploy_dev.sh
    environment:
      - LOCATION_REDIS=redis://dev_redis:6379/0
    volumes:
      - .:/usr/src/app
    expose:
      - "8000"
    depends_on:
    - solr
    - redis
    # - db
    #- celery
    networks:
    - seenet
  solr:
    image: solr
    ports:
     - "8983:8983"
    volumes:
      - data:/opt/solr/server/solr/mycores
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - mycore
    networks:
      - seenet
  # celery:
  #   build: .
  #   container_name: dev_celery_worker
  #   command: celery -A bizrefpro --app=bizrefpro.celery.app  worker --loglevel=info
  #   environment:
  #     - LOCATION_REDIS=redis://dev_redis:6379/0
  #   volumes:
  #     - .:/usr/src/app
  #   depends_on:
  #     - web
  #   networks:
  #     - seenet
  redis:
    image: 'redis:5.0.3'
    container_name: dev_redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - .:/usr/src/app
    networks:
      - seenet
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: 'bizrefpro'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'my_user'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'my_pass'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'my_root_pass'
      MYSQL_ROOT_HOST: '%'
    ports:
      # <Port exposed> : < MySQL Port running inside container>
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    networks:
      - seenet
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - seenet
volumes:
  data:
    driver: local



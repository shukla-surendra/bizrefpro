{% extends 'executive/state-manager/layouts/layout.html' %}
{% block content  %} 
  <!-- right content section begin -->
  <section class="panel-content-wrap col-lg-10 col-md-10 col-sm-11 col-xs-10">
        <div class="panel-body">
            <div class="body-wrap">
                <!-- row welcome panel begin -->
                <div class="row">
                    <form action="" id="header-form" method="post" enctype="multipart/form-data">
                        
                    <div class="col-md-12 col-sm-12 col-xs-12">
                       <div class="section-title">
                            <h2><i class="fa fa-file-text-o"></i>State Manager({{breadcrumb}}) >> Zone Managers</h2>
                        </div>
                    </div>
                    
                    <div class="col-md-12">
                                
                          <div class="panel-full">
                          
                            <div class="panel-full-content">
                                <h2>Search by</h2>
                                <!--- item begin -->
                                <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pad-zero">
                                    <div class="panel-full-postbox">
                                        <!-- header begin -->
                                        <div class="panel-full-header">
                                            
                                            <div class="col-md-3 col-sm-3 col-xs-12">
                                                 <label>Zone</label><br>
                                                <select name="zone" id="zone">
                                                <option value="">Select Zone</option>
                                                   {% for zone in zones %}
                                                    <option value="{{zone.id}}">{{zone.name}}</option>
                                                   {% endfor %}
                                                </select>
                                            </div>
                                            
                                             <div class="col-md-2 col-sm-2 col-xs-12">
                                               <label>Start date</label><br>
                                                <input type="date" placeholder="" id="startDate">
                                            </div>
                                            <div class="col-md-2 col-sm-2 col-xs-12">
                                               <label>End date</label><br>
                                                <input type="date" placeholder="" id="endDate">
                                            </div>
                                            <div class="col-md-2 col-sm-2 col-xs-12">
                                                 <a href="#" id="mybtn6">Submit</a>
                                            </div>
                                            
                                        </div>
                                        <!-- header end -->
                                        
                                    </div>
                                </div>
                                <!--- item end -->
                                
                            </div>
                        </div>
                        
                    </div>
                    
                    <div class="col-md-12">
                        <div class="posts-panel">
                            <div class="posts-panel-content">
                                
                                <div id="no-more-tables">
                                    <table class="col-md-12 table-condensed pad-zero" id="zoneManager">
                                        <thead class="thead-inverse">
                                            <tr>
                                                <th><input type="checkbox" class="checkall">Zone City Manager<a href="#"><i class="fa fa-arrow-circle-o-up" aria-hidden="true"></i></a> <a href="#"><i class="fa fa-arrow-circle-o-down" aria-hidden="true"></i></a></th>
                                                 <th>City/Zone</th>
                                                 <th>Executive </th>
                                                 <th>Leads</th>
                                                 <th>Revenue</th>
                                                 <th>Status</th>
                                                 <th>Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="tbody-inverse">

                                       </tbody>
                                      
                                    </table>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                    </form>
                </div>
                <!-- row welcome panel end -->
                
            </div>
        </div>
    </section>
    <script>
        datatable = $('#zoneManager').DataTable( {
        "processing": true,
        "searching": true,
        "serverSide": true,
        "ajax": {
            "url": "/executive/get_zonecity_manager?executive_id={{executive_id}}&state={{state}}",
            "type": "GET",
        },
        "columns": [
            { "data": "zone-city-manager" },
            { "data": "zone-city" },
            { "data": "executive_count" },
            { "data": "leads_count" },
            { "data": "revenue" },
            { "data": "status" },
            { "data": "action" }
        ]
    });

    $(document).on("click", "#mybtn6", function(e){
        e.preventDefault();
         zone = $("#zone").val();
         startDate = $("#startDate").val();
         endDate = $("#endDate").val();
         searchField = zone+","+startDate+","+endDate;
         console.log(searchField)
        $("#zoneManager").dataTable().api().columns(0).search(searchField).draw();

    });

</script>
    <!-- right content section end -->

{% endblock %}

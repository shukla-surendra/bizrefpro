{% extends 'administration/layouts/layout.html' %}
{% block content  %}
<section class="content">
        <div class="row">
                <!-- left column -->
                <div class="col-md-6">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
                  <!-- general form elements -->
                  <div class="box box-primary">
                    <div class="box-header with-border">
                      <h3 class="box-title">Category Import</h3>
                    </div>
                    <!-- /.box-header -->
                    <!-- form start -->
                    <form role="form" action="" method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="form-group">
                          <label for="state">Parent Category</label>
                          <select name="parent_id" class="form-control" id="state">
                              <option value="0">No Parent Category</option>
                              {% for category in parent_categories%}
                              <option value="{{category.id}}">{{category.name}}</option>
                              {% endfor %}
                          </select>
                          <p><b>**</b> if there is no parent category selected it will import all category as parent</p>
                        </div>


                        <div class="form-group">
                          <label for="exampleInputEmail1">Select CSV</label>
                          <input type="file" name = "csv_file" required="required" class="form-control" id="exampleInputEmail1" placeholder="Enter email">
                        </div>



                      </div>
                      <!-- /.box-body -->

                      <div class="box-footer">
                        <button type="submit" class="btn btn-primary">Submit</button>
                      </div>
                    </form>
                  </div>
                  <!-- /.box -->



                </div>
                <!--/.col (left) -->

              </div>
              <!-- /.row -->
</section>
{% endblock %}

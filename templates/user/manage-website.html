{% extends 'user/layouts/layout.html' %}
{% block content  %}

                    <div class="body-wrap">
					<!-- row welcome panel begin -->
                        <div class="row">
                            
                            <div class="col-md-12 col-sm-12 col-xs-12">
                                <div class="section-title">
                                    <h2><i class="fa fa-file-text-o"></i>Manage Website</h2>
                                </div>
                                <div class="section-tab-add">
                                    <a class="btn btn-info" href="/user/add-website">Add New</a>
                                     <button type="button" id="deleteall" class="btn btn-danger">Delete</button>
                                </div>
                            </div>

                            {% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
                            
                            <div class="col-md-12">
                                <div class="posts-panel">
                                    <div class="posts-panel-content">
                                        
                                        <div id="no-more-tables">
                                            <table class="col-md-12 table-condensed pad-zero">
                                                <thead class="thead-inverse">
                                                    <tr>
                                                        <th><input type="checkbox" class="checkall"> Website Name</th>
                                                       <!-- <th>Search Engine Ranking</th>-->
                                                        <th>Action</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="tbody-inverse">
                                                
                                                    {% for website in websites %}
                                                    <tr>
														<td>
															<input type="checkbox" value="295" name="selectcheck" class="selectcheck">&nbsp;&nbsp;{{website.name}}
														</td>
														<!-- <td>HIT</td> --> 
														<td>
															<a href="/user/edit-website/{{website.id}}" class="ico_edit" alt="Edit" title="Edit"><i class="fa fa-pencil-square-o"></i></a>
															<a href="/user/delete-website/{{website.id}}" class="ico_delete" alt="Delete" title="Delete"><i class="fa fa-times"></i></a>
														</td>
													</tr> 
                                                    {% endfor %}
                                                   
                                               </tbody>
                                            </table>
                                        </div>
                                        
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- row welcome panel end -->
                        
                    </div>
                
               
               {% endblock  %}

{% extends 'user/layouts/layout.html' %}
{% block content  %}
	<div class="body-wrap">
		<!-- row welcome panel begin -->
		<div class="row">
			<form action="" id="header-form" method="post" enctype="multipart/form-data">
				{% csrf_token %}
				<div class="col-md-12 col-sm-12 col-xs-12">
					<div class="section-title">
						<h2><i class="fa fa-file-text-o"></i>Refer Friend</h2>
					</div>
				</div>
			
				<div class="col-md-12">
				
					{% if messages %}
					<div class="success_msg">
						{% for message in messages %}
							{{ message }}
						{% endfor %}
					</div>
					{% endif %}
				
						<div class="panel-full">
							<div class="panel-full-content">
								<!--- item begin -->
								<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pad-zero">
									<div class="panel-full-postbox">
										<!-- header begin -->
										<div class="panel-full-header">
										
											<!-- item begin -->
											<div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
												<div class="row">
													<div class="item_form">
														<div class="col-md-12 col-sm-12 col-xs-12">
															<label>Name</label>
															<input type="text" name="name" required placeholder="Enter Name"/>
														</div>
													</div>
												</div>
											</div>
											<!-- item begin -->
											
											<!-- item begin -->
											<div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
												<div class="row">
													<div class="item_form">
														<div class="col-md-12 col-sm-12 col-xs-12">
															<label>Email</label>
															<input type="text" name="email" required placeholder="Enter Email"/>
														</div>
													</div>
												</div>
											</div>
											<!-- item begin -->
											
											<!-- item begin -->
											<div class="col-lg-6 col-md-6 col-sm-6 col-xs-12">
												<div class="row">
													<div class="item_form">
														<div class="col-md-12 col-sm-12 col-xs-12">
															<label>Contact Number</label>
															<input type="text" name="phone" required placeholder="Enter Contact Number" />
														</div>
													</div>
												</div>
											</div>
											<!-- item begin -->
											
											<!-- item begin -->
											<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
												<div class="row">
													<div class="item_form">
														<div class="col-md-12 col-sm-12 col-xs-12">
															<button id="mybtn4">Send Invitation</button>
														</div>
													</div>
												</div>
											</div>
											<!-- item begin -->
											
										</div>
										<!-- header end -->
										
									</div>
								</div>
								<!--- item end -->

							</div>
						</div>

						<div class="panel-full">
							<div class="panel-full-content">
								<!--- item begin -->
								<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pad-zero">
									<div class="panel-full-postbox">
										<!-- header begin -->
										<div class="panel-full-header">
										
										<div id="no-more-tables">
											<table class="col-md-12 table-condensed pad-zero" id="invitationTable">
												<thead class="thead-inverse">
													<tr>
														<th>Name</th>
														<th>Email</th>
														<th>Phone</th>
													</tr>
												</thead>
												<tbody class="tbody-inverse">
												
												</tbody>
											</table>
										</div>

										  <!-- <table id="invitationTable" class="table">
										  <thead>
										  <tr>
										  <td>Name</td>
										  <td>Email</td>
										  <td>Phone</td>
										   </tr>

											</thead>
											<tbody>

											</tbody>
											</table> -->

										</div>
										<!-- header end -->

									</div>
								</div>
								<!--- item end -->

							</div>
						</div>

			</div>
			</form>
		</div>
		<!-- row welcome panel end -->
		
	</div>
{% endblock%}

{% extends 'user/layouts/layout.html' %}
{% block content  %}
	<div class="body-wrap">
		<!-- row welcome panel begin -->
		<div class="row">
			<form action="" id="header-form" method="post" enctype="multipart/form-data">
				{% csrf_token %}
				<div class="col-md-12 col-sm-12 col-xs-12">
					<div class="section-title">
						<h2><i class="fa fa-file-text-o"></i>Add Website</h2>
					</div>
				</div>
			
				<div class="col-md-12">
					<div class="panel-full">
						<div class="panel-full-content">
							<!--- item begin -->
							<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pad-zero">
								<div class="panel-full-postbox">
									<!-- header begin -->
									<div class="panel-full-header">
									
										<!-- item begin -->
										<div class="item_form">
											<div class="col-md-12 col-sm-12 col-xs-12">
												<div class="col-md-12 col-sm-12 col-xs-12">
													<label>Add website</label>
													<div class="row">
														<div class="col-md-2 col-sm-2 col-xs-12">
															<select name="" onchange="myFunction(this.value);">
																<option value="">Select Url type</option>
																<option value="http://">http://</option>	
																<option value="https://">https://</option>
															</select>
														</div>
														<div class="col-md-8 col-sm-8 col-xs-12">
															<input type="text" id="myText" name="name" required placeholder="Enter Your website"/>
														</div>
														<div class="col-md-2 col-sm-2 col-xs-12">
														   <button id="mybtn4">Save</button>
														</div>
													</div>
												</div>
											</div>
										</div>
										<!-- item end -->
									
									</div>
									<!-- header end -->
									
								</div>
							</div>
							<!--- item end -->
							
						</div>
					</div>
				</div>
				
			</form>
		</div>
		<!-- row welcome panel end -->
		
	</div>
{% endblock%}

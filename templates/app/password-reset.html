{% extends 'app/layouts/layout.html' %}
{% block content  %}    
            <!-- content section begin -->
            <div class="cl-default-wrapper">
                <div class="cl-default-wrapper-in">
                    <div class="container">
                        <div class="row">

{% if showForm %}
                                                       <!-- content left section begin -->
                            <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6">
                                <div class="login-form">
                                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                        <div class="login-form-title">
                                            <h4>Reset Your Password</h4>
                                                                    {% if msg_type == "failure" %}
<div class="alert alert-danger">
  <strong>Alert!</strong> {{message}}.
</div>
            {% endif %}
                                        </div>
                                    </div>
                                    <form method="post" action="" id="resetPasswordForm">
                                        {% csrf_token %}
                                        <input type="hidden" name="form_type" value="signin">
                                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 login-popup-item">
                                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                                <label>New Password</label>
                                            </div>
                                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                                <div class="popup-cont">
                                                    <input name="password" id="password" placeholder="Password" autocomplete="off" required="" type="password">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 login-popup-item">
                                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                                <label>Confirm New Password</label>
                                            </div>
                                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                                <div class="popup-cont">
                                                    <input name="cpassword"  id="cpassword" placeholder="Password" required="" autocomplete="off" type="password">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 login-popup-item">
                                            <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
                                                <div class="popup-cont">
                                                    <button class="btn-style-2">Reset Password</button>
                                                </div>
                                            </div>
                                        </div>
                                </form>
                                </div>
                            </div>
                            <!-- content left section end -->
                            {% endif %}
                        {% if msg_type == "success" %}
<div class="alert alert-success">
  <strong>Success!</strong> {{message}}.
</div>
            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            <!-- content section end -->
            {% endblock %}

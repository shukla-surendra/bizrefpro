{% extends 'executive/zone-manager/layouts/layout.html' %}
{% block content  %} 
<!-- right content section begin -->
<section class="panel-content-wrap col-lg-10 col-md-10 col-sm-11 col-xs-10">
    <div class="panel-body">
        <div class="body-wrap">
            <!-- row welcome panel begin -->
            <div class="row">
                <form action="" id="header-form" method="post" enctype="multipart/form-data">
                    
                <div class="col-md-12 col-sm-12 col-xs-12">
                  <div class="section-title">
                        <h2><i class="fa fa-tachometer"></i>{{breadcrumb}}</h2>
                    </div>
                </div>
                
                <div class="col-md-12">
                            
                      <div class="panel-full">
                      
                        <div class="panel-full-content">
                            <h2>Search by</h2>
                            <!--- item begin -->
                            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12 pad-zero">
                                <div class="panel-full-postbox">
                                    <!-- header begin -->
                                    <div class="panel-full-header">
                                       
                                  
                                         <div class="col-md-2 col-sm-2 col-xs-12">
                                           <label>Start date</label><br>
                                            <input type="date" name="startDate" id="startDate" placeholder="">
                                        </div>
                                        <div class="col-md-2 col-sm-2 col-xs-12">
                                           <label>End date</label><br>
                                            <input type="date" name="endDate" id="endDate" placeholder="">
                                        </div>
                                        <div class="col-md-2 col-sm-2 col-xs-12">
                                             <a href="#" id="mybtn6">Submit</a>
                                        </div>
                                        
                                    </div>
                                    <!-- header end -->
                                    
                                </div>
                            </div>
                            <!--- item end -->
                            
                        </div>
                    </div>
                    
                </div>
                
                <div class="col-md-12">
                    <div class="posts-panel">
                        <div class="posts-panel-content">
                            
                            <div id="no-more-tables">
                                <table class="col-md-12 table-condensed pad-zero" id="executiveDataTable">
                                    <thead class="thead-inverse">
                                        <tr>
                                            <th><input type="checkbox" class="checkall">Executive <a href="#"><i class="fa fa-arrow-circle-o-up" aria-hidden="true"></i></a> <a href="#"><i class="fa fa-arrow-circle-o-down" aria-hidden="true"></i></a>
</th>
                                            <th>City/Zone</th>
                                            <th>Leads</th>
                                             <th>Revenue</th>
                                            <th>Status</th>
                                             <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="tbody-inverse">

                                   </tbody>
                                </table>
                            </div>
                            
                        </div>
                    </div>
                </div>
                </form>
            </div>
            <!-- row welcome panel end -->
            
        </div>
    </div>
</section>
<script>
        $('#executiveDataTable').DataTable( {
        "processing": true,
        "serverSide": true,
        "ajax": {
            "url": "/executive/get_executive_data?zone={{zone_id}}&role={{role}}&state={{state}}",
            "type": "GET",
        },
        "columns": [
            { "data": "executive" },
            { "data": "zone" },
            { "data": "leads" },
            { "data": "revenue" },
            { "data": "status" },
            { "data": "action" }
        ]
    } );
    $(document).on("click", "#mybtn6", function(e){
        e.preventDefault();
       
         startDate = $("#startDate").val();
         endDate = $("#endDate").val();
         searchField = ""+","+startDate+","+endDate;
         console.log(searchField)
        $("#executiveDataTable").dataTable().api().columns(0).search(searchField).draw();

    });
</script>
<!-- right content section end -->
{% endblock %}

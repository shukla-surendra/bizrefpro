upstream web {
   ip_hash;
   server web:8000;
 }

 # portal
 server {
   location / {
         proxy_pass http://web/;
         proxy_set_header Host $http_host;
     }
   listen 80;
   client_max_body_size 20M;
   server_name localhost;
   error_log  /var/log/nginx/dev_error.log;
   access_log /var/log/nginx/dev_access.log;

   location /static {
     autoindex on;
     alias /usr/src/app/static/;
   }
 }


